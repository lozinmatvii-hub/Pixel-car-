<title>Піксельний драйв</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: one centred 16:10 pixel screen (the cabin from the photo), hint line below, touch pads only on phones. */
:root{
  --bg:#14161a;
  --panel:#1d2025;
  --line:#2c3037;
  --fg:#e6e8e3;
  --muted:#8e958c;
  --accent:#e0852a;
  --accent-ink:#1a1206;
  --font-px:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-px);
  margin:0;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px}
.screen{position:relative;width:100%;aspect-ratio:8/5;background:#000;border:2px solid var(--line);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.4vw,22px);text-align:center;padding:16px;
  background:rgba(12,14,16,.66);
}
.overlay[hidden]{display:none!important}
.overlay h1{margin:0;font-size:clamp(14px,3.6vw,30px);font-weight:400;line-height:1.35;text-wrap:balance;color:var(--fg)}
.overlay p{margin:0;max-width:34em;font-size:clamp(7px,1.45vw,11px);line-height:1.9;color:var(--muted);text-wrap:balance}
.overlay p b{color:var(--fg);font-weight:400}
.menu{display:grid;gap:clamp(6px,1.4vw,12px);justify-items:center}
.menu .row{display:flex;gap:clamp(6px,1.2vw,10px);flex-wrap:wrap;justify-content:center}
.opt{font-family:var(--font-px);font-size:clamp(7px,1.5vw,11px);background:var(--panel);color:var(--fg);border:2px solid var(--line);padding:clamp(6px,1.1vw,9px) clamp(8px,1.5vw,12px);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.menu .lbl{font-size:clamp(6px,1.2vw,9px);color:var(--muted);letter-spacing:.06em}
.menu .info{margin:0;font-size:clamp(6px,1.2vw,9px);line-height:1.7;color:var(--muted);min-height:2.4em}
.overlay{overflow:auto}
.btn.alt{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  font-family:var(--font-px);font-size:clamp(9px,1.8vw,13px);background:var(--accent);color:var(--accent-ink);
  border:0;padding:clamp(10px,1.8vw,14px) clamp(16px,3vw,26px);cursor:pointer;letter-spacing:.04em;
}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.pad:focus-visible,.mute:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hint{margin:0;font-size:9px;line-height:1.9;color:var(--muted);min-width:0}
.hint b{color:var(--fg);font-weight:400}
.mute{font-family:var(--font-px);font-size:9px;background:var(--panel);color:var(--fg);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.pads{display:none;gap:12px;justify-content:space-between;touch-action:none}
.pads .grp{display:flex;gap:12px}
.pad{
  font-family:var(--font-px);font-size:11px;color:var(--fg);background:var(--panel);border:2px solid var(--line);
  min-width:68px;height:68px;padding:0 10px;user-select:none;-webkit-user-select:none;touch-action:none;
}
.pad.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (hover:none) and (pointer:coarse){ .pads{display:flex;justify-content:flex-end} .hint{display:none} }
@media (prefers-reduced-motion:reduce){ .btn{transition:none} }

<main class="wrap">
  <div class="screen">
    <canvas id="c" width="320" height="200" aria-label="Гра: їзда трасою від першої особи"></canvas>
    <div class="overlay" id="ov">
      <h1 id="ovTitle">Піксельний драйв</h1>
      <p id="ovText">Траса під великим небом, дві смуги і потік машин. Доїжджайте до контрольних точок: на кожній додається час.</p>
      <div class="menu" id="menu">
        <span class="lbl">РЕЖИМ</span>
        <div class="row" role="group" aria-label="Режим гри">
          <button class="opt" type="button" data-mode="time" aria-pressed="true">На час</button>
          <button class="opt" type="button" data-mode="free" aria-pressed="false">Вільна їзда</button>
        </div>
        <span class="lbl">МАШИНА</span>

          <button class="opt" type="button" data-car="suv" aria-pressed="true">Кросовер</button>
          <button class="opt" type="button" data-car="sport" aria-pressed="false">Спорткар</button>
          <button class="opt" type="button" data-car="sedan" aria-pressed="false">Седан</button>
          <button class="opt" type="button" data-car="gtr" aria-pressed="false" hidden>GT-R ★</button>
        </div>
        <p class="info" id="info"></p>
      </div>
      <div class="btns">
        <button class="btn" id="go" type="button">Поїхати</button>
        <button class="btn alt" id="menuBtn" type="button" hidden>Меню</button>
      </div>
    </div>
  </div>
  <div class="pads" id="pads">
    <div class="grp">
      <button class="pad" type="button" data-k="down">ГАЛЬМО</button>
      <button class="pad" type="button" data-k="up">ГАЗ</button>
    </div>
  </div>
  <div class="bar">
    <p class="hint"><b>W / ↑</b> газ · <b>S / ↓</b> гальмо · <b>кермо</b> тягніть мишею або пальцем (також A D / ← →) · <b>Enter</b> старт</p>
    <span><button class="mute" id="toMenu" type="button">Меню</button> <button class="mute" id="mute" type="button">Звук: ввімк</button></span>
  </div>
</main>

<script>

/* ---------- 3x5 pixel font ---------- */
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111',
  'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
  'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','K':'101101110101101',
  'L':'100100100100111','M':'101111111101101','N':'110101101101101','O':'010101101101010','P':'110101110100100',
  'R':'110101110101101','S':'011100010001110','T':'111010010010010','U':'101101101101111','V':'101101101101010',
  'W':'101101111111101','X':'101101010101101','Y':'101101010010010','Z':'111001010100111',
  '.':'000000000000010',':':'000010000010000','-':'000000111000000','/':'001001010100100','+':'000010111010000','!':'010010010000010'

function text(s, x, y, c, sc) { sc = sc || 1; for (const ch of s) { const g = FONT[ch]; if (g) for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (g[r * 3 + q] === '1') rect(x + q * sc, y + r * sc, sc, sc, c); x += 4 * sc; } }

/* ---------- track ---------- */

function brect(b, x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) bpx(b, i, j, c); }

function makeTree(seed) {

const HOR = 56, K = 230, ROWS = 56, HWK = 3.0, RW = 6, CP_SPACING = 900, LANES = [-0.39, 0.39];
const CEN = new Float32Array(ROWS + 2), HW = new Float32Array(ROWS + 2);
const CARCFG = {

  gtr:   { max: 78, acc: 22, steer: 1.6, drift: 2.4, info: 'Секретний GT-R: рожеве хутро, нічне небо, найшвидша машина в грі.' }
};
let CFG = CARCFG.suv;
const keys = { up: false, down: false, left: false, right: false };
const S = { mode: 'title', type: 'time', car: 'suv', pos: 0, v: 0, x: 0, steer: 0, rpm: 900, time: 45, dist: 0, nextCP: CP_SPACING, cpCount: 0, msg: '', msgT: 0, shake: 0, crashT: 0, invul: 0, heading: 0, bump: 0, cars: [], best: 0, off: false };
try { S.best = parseFloat(localStorage.getItem('pixel-drive-best') || '0') || 0; } catch (e) { /* storage may be blocked */ }

const GEARS = [0, 40, 78, 118, 160];
function updateRpm(dt) {
  const k = S.v * 3.6; let g = 0; for (let i = 0; i < GEARS.length; i++) if (k >= GEARS[i]) g = i;
  const lo = GEARS[g], hi = g + 1 < GEARS.length ? GEARS[g + 1] : 200;
  const target = 1000 + Math.min(1, (k - lo) / (hi - lo)) * 5800 + (keys.up && S.mode === 'play' ? 300 : 0);
  S.rpm += (target - S.rpm) * Math.min(1, dt * 9);
}

function spawnCars() {
  while (S.cars.length < 6) {
    const z = S.pos + 130 + Math.random() * 190, u = LANES[(Math.random() * 2) | 0];
    if (S.cars.some((c) => Math.abs(c.z - z) < 40 && Math.abs(c.u - u) < .3)) continue;
    S.cars.push({ z, u, v: 17 + Math.random() * 15, k: (Math.random() * 5) | 0 });
  }
}

function setMsg(t, s) { S.msg = t; S.msgT = s; }

function startGame() {
  if (S.mode === 'play') return;
  audioStart();
  CFG = CARCFG[S.car]; S.mode = 'play'; S.time = S.type === 'time' ? 45 : 99; S.dist = 0; S.nextCP = CP_SPACING; S.cpCount = 0; S.crashT = 0; S.invul = 0; S.shake = 0;
  S.cars = []; spawnCars(); S.cars.forEach((c) => { c.z = Math.max(c.z, S.pos + 150); });

}

function showMenu() {

  document.getElementById('menu').hidden = false; document.getElementById('menuBtn').hidden = true;
  document.getElementById('go').textContent = 'Поїхати'; document.getElementById('ov').hidden = false;

function endGame() {
  S.mode = 'over';
  const km = S.dist / 1000; let rec = false;

  document.getElementById('ovTitle').textContent = 'Час вийшов';

function crash(car) {
  S.v = Math.min(S.v, car.v * 0.5); S.crashT = 0.14; S.shake = 0.5; S.invul = 1.3;
  S.x += (S.x >= car.u ? 1 : -1) * 0.18; car.z += 8; car.v += 4;

function update(dt) {
  const st = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (S.mode === 'play') {
    if (!drag.on) S.steer += (st - S.steer) * Math.min(1, dt * (st ? 7 : 10));
    let a = 0;
    if (keys.up) a += CFG.acc * (1 - Math.pow(S.v / CFG.max, 1.5)) + 1;
    if (keys.down) a -= 30;
    a -= 0.9 + S.v * 0.012;
    S.off = Math.abs(S.x) > 1.0;
    if (S.off && S.v > 16) a -= (S.v - 16) * 1.5;
    S.v = Math.max(0, S.v + a * dt);
    S.pos += S.v * dt; S.dist += S.v * dt;
    S.x += S.steer * Math.min(1, S.v / 18) * CFG.steer * dt * (1 - 0.35 * S.v / CFG.max);
    S.x -= curve(S.pos + 6) * S.v * CFG.drift * dt;
    if (S.x > 2.6) { S.x = 2.6; S.v *= 1 - dt * 3; } if (S.x < -2.6) { S.x = -2.6; S.v *= 1 - dt * 3; }
    if (S.type === 'time') S.time -= dt;
    if (S.type === 'time' && S.dist >= S.nextCP) { const bonus = Math.max(14, 24 - 2 * S.cpCount); S.time = Math.min(99, S.time + bonus); S.cpCount++; S.nextCP += CP_SPACING; setMsg('CHECKPOINT +' + bonus + 'S', 2); }
    if (S.invul > 0) S.invul -= dt;
    else for (const c of S.cars) { const dz = c.z - S.pos; if (dz > 0.5 && dz < 4 && Math.abs(c.u - S.x) < 0.3) { crash(c); break; } }
    if (S.type === 'time' && S.time <= 0) { S.time = 0; endGame(); }
  } else {
    if (S.mode === 'title') {
      S.v += (24 - S.v) * Math.min(1, dt * 0.8);
      S.steer += (Math.max(-1, Math.min(1, curve(S.pos + 30) * 260)) - S.steer) * Math.min(1, dt * 3);
      S.x += (0 - S.x) * Math.min(1, dt * 2); S.cars = []; S.off = false;
    } else {
      S.v = Math.max(0, S.v - 16 * dt); S.steer += (0 - S.steer) * Math.min(1, dt * 4);
      S.x -= curve(S.pos + 6) * S.v * CFG.drift * dt;
    }
    S.pos += S.v * dt;
  }
  if (S.msgT > 0) S.msgT -= dt;
  if (S.crashT > 0) S.crashT -= dt;
  if (S.shake > 0) S.shake -= dt;
  S.heading += curve(S.pos) * S.v * dt;
  if (S.mode !== 'title') { for (const c of S.cars) c.z += c.v * dt; S.cars = S.cars.filter((c) => c.z > S.pos - 15 && c.z < S.pos + 330); if (S.mode === 'play') spawnCars(); }
  const rough = (S.off ? 3 : 1.2) * Math.min(1, S.v / 30) + (S.shake > 0 ? 2 : 0);
  S.bump = Math.round((hash(Math.floor(S.pos * 0.8)) - 0.5) * rough);
  updateRpm(dt); audioUpdate();
}

/* ---------- render: road scene ---------- */
let curHor = HOR;
function renderScene() {
  const hor = curHor = HOR + S.bump;
  const sho = S.heading * 90;
  for (let y = 0; y <= hor; y++) {
    const base = mix(SKY0, SKY1, Math.pow(y / hor, 1.3));
    for (let x = 0; x < W; x++) {
      const hx = x + sho, v = Math.sin(hx * 0.021 + y * 0.16) * 0.5 + Math.sin(hx * 0.047 - y * 0.09 + 2) * 0.3 + Math.sin(hx * 0.011 + y * 0.33) * 0.2;
      buf[y * W + x] = v > 0.12 ? mix(base, CLOUD, Math.min(0.55, (v - 0.12) * 1.1)) : v < -0.35 ? mix(base, CLOUDD, Math.min(0.35, (-0.35 - v) * 0.8)) : base;
    }
  }
  const ho = S.heading * 90;
  for (let x = 0; x < W; x++) {
    const hx = x + ho;
    const hh = 1.6 + 1.4 * Math.sin(hx * 0.045) + 1.0 * Math.sin(hx * 0.13 + 1.3) + hash(Math.floor(hx / 2)) * 1.2;
    const top = Math.round(hor - hh);
    for (let y = Math.max(0, top); y <= hor; y++) buf[y * W + x] = HILL;
    if (Math.sin(hx * 0.02 + 2) > 0.2) { const t = 1 + ((hash(Math.floor(hx / 2) + 500) * 2.2) | 0); for (let k = 1; k <= t; k++) { const y = top - k; if (y >= 0) buf[y * W + x] = HILL2; } }
  }
  let off = 0, dx = 0, prev = K / ROWS;
  for (let h = ROWS; h >= 1; h--) {
    const d = K / h, dd = d - prev; dx += curve(S.pos + d) * dd; off += dx * dd; prev = d;
    HW[h] = h * HWK; CEN[h] = W / 2 - S.x * HW[h] + off * HW[h] / RW;
  }
  HW[ROWS + 1] = HW[ROWS]; CEN[ROWS + 1] = CEN[ROWS];
  for (let h = 1; h <= ROWS; h++) {
    const y = hor + h; if (y >= H) break;
    const d = K / h, z = S.pos + d, fog = 0.9 / (1 + h * 0.25), band = Math.floor(z / 16);
    const gl = mix((band & 1) ? GRA : GRB, HAZE, fog), gr = mix(((band + 1) & 1) ? GRA : GRB, HAZE, fog);
    const asph = mix(ASPH, HAZE, fog), shld = mix(SHLD, HAZE, fog), line = mix(LINE, HAZE, fog * 0.6), red = mix(col('#c9514a'), HAZE, fog);
    const cen = CEN[h], hw = HW[h], zq = Math.floor(z * 1.1), row = y * W;
    const lw = Math.max(0.6, 0.0125 * hw), zebra = (z % 1500) < 5;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5 - cen) / hw, au = u < 0 ? -u : u, n = hash(x * 73856093 ^ zq * 19349663);
      let c, dl;
      if (au <= 1.0) {
        c = au > 0.78 ? shld : asph; dl = (n - 0.5) * 14;
        if (Math.abs(au - 0.39) < 0.11) dl -= 5;
        if (zebra && au < 0.78) { c = (Math.floor((x - cen) / Math.max(1, hw * 0.08)) & 1) ? line : red; dl = 0; }
        else if (hw * au < lw || hw * Math.abs(au - 0.78) < lw) { c = line; dl = 0; }
      } else { c = u < 0 ? gl : gr; dl = (n - 0.5) * 16; }
      buf[row + x] = shade(c, dl | 0);
    }
  }
}

function drawSprite(bm, d, lat, wM, hM) {
  const h = K / d; if (h < 1 || h > ROWS - 0.5) return;
  const i0 = Math.floor(h), f = h - i0;
  const cen = CEN[i0] * (1 - f) + CEN[i0 + 1] * f, hw = HW[i0] * (1 - f) + HW[i0 + 1] * f, ppm = hw / RW;
  const tw_ = Math.max(1, Math.round(wM * ppm)), th = Math.round(hM * ppm); if (th < 2) return;
  const left = Math.round(cen + lat * hw - tw_ / 2), top = Math.round(curHor + h - th), fog = 0.9 / (1 + h * 0.25) * 0.8;
  for (let j = 0; j < th; j++) {
    const yy = top + j; if (yy < 0 || yy >= H) continue;
    const sy = Math.min(bm.h - 1, (j * bm.h / th) | 0);
    for (let i = 0; i < tw_; i++) {
      const xx = left + i; if (xx < 0 || xx >= W) continue;
      const c = bm.d[sy * bm.w + ((i * bm.w / tw_) | 0)];
      if (c) buf[yy * W + xx] = fog > 0.12 ? mix(c, HAZE, fog) : c;
    }
  }
}

function renderSprites() {
  const list = [], CELL = 11, far = K * 0.9;
  const iMin = Math.floor((S.pos + 5.5) / CELL), iMax = Math.floor((S.pos + far) / CELL);
  for (let i = iMin; i <= iMax; i++) {
    for (let s = -1; s <= 1; s += 2) {
      const z = i * CELL + hash(i * 5 + s) * CELL, d = z - S.pos; if (d < 5.5 || d > far) continue;
      const r = hash(i * 2 + (s > 0 ? 1 : 0) + 99);
      if (s > 0 && i % 4 === 0) list.push({ d, lat: 1.5, bm: POLE, w: 1.1, h: 8 });
      else if (s > 0 && i % 9 === 4) list.push({ d, lat: 1.35, bm: SIGN, w: 1.1, h: 2.4 });
      else if (r < 0.15) list.push({ d, lat: s * (1.8 + hash(i * 3 + s * 7) * 4), bm: TREES[(hash(i + 41) * 5) | 0], w: 6, h: 7.5 });
      else if (r < 0.36) list.push({ d, lat: s * (1.3 + hash(i * 9 + s) * 1.6), bm: BUSHES[(hash(i + 7) * 2) | 0], w: 2.6, h: 1.4 });
    }
  }
  for (const c of S.cars) { const d = c.z - S.pos; if (d > 5.5 && d < K) list.push({ d, lat: c.u, bm: CARS[c.k], w: 1.95, h: 1.55 }); }
  list.sort((a, b) => b.d - a.d);
  for (const o of list) drawSprite(o.bm, o.d, o.lat, o.w, o.h);
}

/* ---------- render: cabin (drawn from the photo) ---------- */
function gauge(cx, cy, r, val, ticks, major, redFrom) {
  disc(cx, cy, r + 1, col('#2b2c30')); disc(cx, cy, r, col('#0c0d10'));
  for (let k = 0; k <= ticks; k++) {
    const t = k / ticks, a = (135 + 270 * t) * Math.PI / 180, mj = k % major === 0, r0 = r - (mj ? 4 : 3), r1 = r - 1;
    line(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, (redFrom != null && t >= redFrom) ? col('#d8452f') : col('#c9ced2'));
  }
}
function needle(cx, cy, r, val) { const a = (135 + 270 * Math.max(0, Math.min(1, val))) * Math.PI / 180; line(cx, cy, cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2), col('#ee5a2b')); disc(cx, cy, 1.4, col('#2a2b2f')); }

function drawCabin() {
  // the real photo, pixelated; the glass is transparent so the road shows through
  const gt = S.car === 'gtr' && CAB2 && WHEEL2; const CL = gt ? CAB2 : CAB;
  if (CL) for (let i = 0; i < W * H; i++) { const c = CL[i]; if ((c >>> 24) === 255) buf[i] = c; }
  const kmh = S.v * 3.6;
  if (gt) { drawGtrHud(kmh); drawWheel(); return; }
  // live gauges drawn over the photo's gauges, same positions
  gauge(127, 122, 13, 0, 8, 1, 0.76); needle(127, 122, 13, S.rpm / 8000);
  gauge(193, 122, 13, 0, 4, 2, null); needle(193, 122, 13, S.type === 'free' ? 1 : S.time / 60);
  if (S.mode === 'play' && S.time < 10 && ((S.time * 3) | 0) % 2 === 0) disc(193, 130, 1.4, col('#f2a21c'));
  gauge(159, 117, 15, 0, 12, 2, null);
  text(String(Math.round(kmh)).padStart(3, ' '), 154, 120, col('#cfd3d6'), 1);
  needle(159, 117, 15, kmh / 240);
  // infotainment screen
  rect(223, 80, 77, 17, col('#0b1b1f'));
  text(String(Math.round(kmh)).padStart(3, ' '), 226, 81, col('#d6f2ee'), 2); text('KM/H', 226, 92, col('#6d8a8d'), 1);
  const tl = Math.ceil(S.time), low = S.mode === 'play' && S.time < 10 && ((S.time * 3) | 0) % 2 === 0;
  text('TIME', 253, 81, col('#6d8a8d'), 1); text(S.type === 'free' ? '--' : String(tl).padStart(2, ' '), 253, 87, low ? col('#f25a3a') : (S.type === 'free' ? col('#6d8a8d') : col('#f2b134')), 2);
  const km = S.dist / 1000; text('DIST', 277, 81, col('#6d8a8d'), 1); text(km < 10 ? km.toFixed(1) : String(Math.round(km)), 277, 87, col('#d6f2ee'), 2);
  drawWheel();
}

// the wheel from the photo, rotated around its hub by nearest-neighbour sampling
let WCX = 161, WCY = 164, WR = 85;
function drawWheel() {
  const WHL = (S.car === 'gtr' && WHEEL2) ? WHEEL2 : WHEEL; if (!WHL) return;
  const th = S.steer * 1.1 + (S.off ? (hash(Math.floor(S.pos * 3)) - 0.5) * 0.06 : 0), ca = Math.cos(th), sa = Math.sin(th);
  for (let y = WCY - WR; y < H; y++) {
    if (y < 0) continue;
    for (let x = WCX - WR; x <= WCX + WR; x++) {
      const dx = x + 0.5 - WCX, dy = y + 0.5 - WCY;
      const sx = Math.floor(WCX + dx * ca + dy * sa), sy = Math.floor(WCY - dx * sa + dy * ca);
      if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
      const c = WHL[sy * W + sx]; if ((c >>> 24) === 255) buf[y * W + x] = c;
    }
  }
  px(WCX + Math.sin(th) * (WR - 6), WCY - Math.cos(th) * (WR - 6), col('#ff7a2b'));   // one marker pixel at 12 o'clock
}

// steer by dragging the wheel with mouse or finger
const drag = { on: false, a0: 0, s0: 0 };
const wheelAngle = (e) => { const r = cvs.getBoundingClientRect(); return Math.atan2((e.clientY - r.top) / r.height * H - WCY, (e.clientX - r.left) / r.width * W - WCX); };
cvs.style.touchAction = 'none';
cvs.addEventListener('pointerdown', (e) => {
  const r = cvs.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W - WCX, y = (e.clientY - r.top) / r.height * H - WCY;
  if (Math.hypot(x, y) > WR + 6 || y < -WR) return;
  drag.on = true; drag.a0 = wheelAngle(e); drag.s0 = S.steer; cvs.setPointerCapture(e.pointerId); audioStart(); e.preventDefault();
});
cvs.addEventListener('pointermove', (e) => {
  if (!drag.on) return;
  let d = wheelAngle(e) - drag.a0; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
  S.steer = Math.max(-1, Math.min(1, drag.s0 + d / 1.1));
});
const dragEnd = () => { drag.on = false; };
cvs.addEventListener('pointerup', dragEnd); cvs.addEventListener('pointercancel', dragEnd);

function renderHUD() {
  if (S.msgT > 0 && S.msg) {
    const sc = 2, w = tw(S.msg, sc), x = Math.round((W - w) / 2), y = 14;
    text(S.msg, x + 1, y + 1, col('#1b1b1b'), sc); text(S.msg, x, y, S.msg[0] === 'C' && S.msg[1] === 'R' ? col('#ff6a4d') : col('#fff3c4'), sc);
  }
  if (S.crashT > 0) for (let y = 0; y < 100; y++) for (let x = (y & 1); x < W; x += 2) buf[y * W + x] = shade(buf[y * W + x], 70);
}

/* ---------- audio ---------- */
let AC = null, osc, gain, filt, muted = false;
function audioStart() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      osc = AC.createOscillator(); osc.type = 'sawtooth'; filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 500;
      gain = AC.createGain(); gain.gain.value = 0; osc.connect(filt); filt.connect(gain); gain.connect(AC.destination); osc.start();
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function audioUpdate() {
  if (!AC) return;
  const t = AC.currentTime, on = S.mode === 'play' && !muted;
  osc.frequency.setTargetAtTime(28 + S.rpm / 42, t, 0.05); filt.frequency.setTargetAtTime(280 + S.rpm * 0.22, t, 0.08);
  gain.gain.setTargetAtTime(on ? 0.05 + (keys.up ? 0.03 : 0) : 0, t, 0.08);
}
function thud() {
  if (!AC || muted) return;
  try {
    const n = AC.sampleRate * 0.3, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0.5;
    s.buffer = b; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  } catch (e) { /* ignore */ }
}

/* ---------- input ---------- */
const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
addEventListener('keydown', (e) => {
  const k = map[e.key];
  if (k) { keys[k] = true; e.preventDefault(); audioStart(); return; }
  if (e.key === 'Enter' || (e.key === ' ' && S.mode !== 'play')) { if (S.mode !== 'play') { e.preventDefault(); startGame(); } }
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'Escape' && S.mode !== 'title') showMenu();
});
addEventListener('keyup', (e) => { const k = map[e.key]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.getElementById('go').addEventListener('click', startGame);
document.getElementById('menuBtn').addEventListener('click', showMenu);
document.getElementById('toMenu').addEventListener('click', showMenu);
document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
  const k = b.dataset.mode ? 'mode' : 'car';
  document.querySelectorAll('.opt[data-' + k + ']').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  if (k === 'mode') S.type = b.dataset.mode; else { S.car = b.dataset.car; CFG = CARCFG[S.car]; applyCar(); document.getElementById('info').textContent = CFG.info; }
  try { localStorage.setItem('pixel-drive-sel', S.type + ',' + S.car); } catch (e) { /* ignore */ }
}));
try { if (localStorage.getItem('pixel-drive-gtr') === '1') document.querySelector('.opt[data-car="gtr"]').hidden = false; } catch (e) { /* ignore */ }
try { const sel = (localStorage.getItem('pixel-drive-sel') || '').split(','); if (sel[0] === 'free') document.querySelector('.opt[data-mode="free"]').click(); if (CARCFG[sel[1]] && (sel[1] !== 'gtr' || localStorage.getItem('pixel-drive-gtr') === '1')) document.querySelector('.opt[data-car="' + sel[1] + '"]').click(); } catch (e) { /* ignore */ }
document.getElementById('info').textContent = CARCFG[S.car].info;
document.querySelectorAll('.pad').forEach((b) => {
  const k = b.dataset.k, on = (e) => { e.preventDefault(); keys[k] = true; b.classList.add('on'); audioStart(); }, off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});
function toggleMute() { muted = !muted; document.getElementById('mute').textContent = 'Звук: ' + (muted ? 'вимк' : 'ввімк'); }
document.getElementById('mute').addEventListener('click', toggleMute);

/* ---------- loop ---------- */
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); renderScene(); renderSprites(); nightTint(); drawCabin(); renderHUD();
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
