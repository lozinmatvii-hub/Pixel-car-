<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Піксельний драйв</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: one centred 16:10 pixel screen (the cabin from the photo), hint line below, touch pads only on phones. */
:root{
  --bg:#14161a;
  --panel:#1d2025;
  --line:#2c3037;
  --fg:#e6e8e3;
  --muted:#8e958c;
  --accent:#e0852a;
  --accent-ink:#1a1206;
  --font-px:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-px);
  margin:0;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px}
.screen{position:relative;width:100%;aspect-ratio:8/5;background:#000;border:2px solid var(--line);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.4vw,22px);text-align:center;padding:16px;
  background:rgba(12,14,16,.66);
}
.overlay[hidden]{display:none!important}
@media (max-width:620px){ #ovText,.menu .lbl,.menu .info{display:none} .overlay{gap:6px;padding:8px} .overlay h1{font-size:13px} .menu{gap:5px} .menu .row{gap:5px} .opt{padding:6px 7px} .btn{padding:8px 14px} }
.overlay h1{margin:0;font-size:clamp(14px,3.6vw,30px);font-weight:400;line-height:1.35;text-wrap:balance;color:var(--fg)}
.overlay p{margin:0;max-width:34em;font-size:clamp(7px,1.45vw,11px);line-height:1.9;color:var(--muted);text-wrap:balance}
.overlay p b{color:var(--fg);font-weight:400}
.menu{display:grid;gap:clamp(6px,1.4vw,12px);justify-items:center}
.menu .row{display:flex;gap:clamp(6px,1.2vw,10px);flex-wrap:wrap;justify-content:center}
.opt{font-family:var(--font-px);font-size:clamp(7px,1.5vw,11px);background:var(--panel);color:var(--fg);border:2px solid var(--line);padding:clamp(6px,1.1vw,9px) clamp(8px,1.5vw,12px);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.menu .lbl{font-size:clamp(6px,1.2vw,9px);color:var(--muted);letter-spacing:.06em}
.menu .info{margin:0;font-size:clamp(6px,1.2vw,9px);line-height:1.7;color:var(--muted);min-height:2.4em}
.overlay{overflow:auto}
.btns[hidden],.shop[hidden],.menu[hidden]{display:none!important}
.opt:disabled{opacity:.45;cursor:not-allowed}
.gold{color:#f2c94c}
.shop{display:grid;gap:6px;width:min(600px,100%)}
.shop .head{font-size:clamp(8px,1.6vw,12px);color:var(--fg);margin-bottom:2px}
.shop .it{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:6px 8px;text-align:left;font-size:clamp(6px,1.35vw,10px);line-height:1.6}
.shop .it small{display:block;color:var(--muted);font-size:.85em}
.shop .pips{letter-spacing:.15em;color:var(--accent)}
@media (max-width:620px){ .shop .it small{display:none} .shop{gap:4px} .shop .it{padding:4px 6px} }
.btn.alt{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  font-family:var(--font-px);font-size:clamp(9px,1.8vw,13px);background:var(--accent);color:var(--accent-ink);
  border:0;padding:clamp(10px,1.8vw,14px) clamp(16px,3vw,26px);cursor:pointer;letter-spacing:.04em;
}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.pad:focus-visible,.mute:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hint{margin:0;font-size:9px;line-height:1.9;color:var(--muted);min-width:0}
.hint b{color:var(--fg);font-weight:400}
.mute{font-family:var(--font-px);font-size:9px;background:var(--panel);color:var(--fg);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.pads{display:none;gap:12px;justify-content:space-between;touch-action:none}
.pads .grp{display:flex;gap:12px}
.pad{
  font-family:var(--font-px);font-size:11px;color:var(--fg);background:var(--panel);border:2px solid var(--line);
  min-width:68px;height:68px;padding:0 10px;user-select:none;-webkit-user-select:none;touch-action:none;
}
.pad.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (hover:none) and (pointer:coarse){ .pads{display:flex;justify-content:flex-end} .hint{display:none} }
@media (prefers-reduced-motion:reduce){ .btn{transition:none} }
</style>

<main class="wrap">
  <div class="screen">
    <canvas id="c" width="320" height="200" aria-label="Гра: їзда трасою від першої особи"></canvas>
    <div class="overlay" id="ov">
      <h1 id="ovTitle">Піксельний драйв</h1>
      <p id="ovText">Траса під великим небом, дві смуги і потік машин. Доїжджайте до контрольних точок: на кожній додається час.</p>
      <div class="menu" id="menu">
        <span class="lbl">РЕЖИМ</span>
        <div class="row" role="group" aria-label="Режим гри">
          <button class="opt" type="button" data-mode="time" aria-pressed="true">На час</button>
          <button class="opt" type="button" data-mode="free" aria-pressed="false">Вільна їзда</button>
        </div>
        <span class="lbl">ДОРОГА</span>
        <div class="row" role="group" aria-label="Дорога">
          <button class="opt" type="button" data-road="straight" aria-pressed="true">Рівна</button>
          <button class="opt" type="button" data-road="curvy" aria-pressed="false">З поворотами</button>
        </div>
        <span class="lbl">ПОГОДА</span>
        <div class="row" role="group" aria-label="Погода">
          <button class="opt" type="button" data-weather="clear" aria-pressed="true">Ясно</button>
          <button class="opt" type="button" data-weather="cloudy" aria-pressed="false">Хмарно</button>
          <button class="opt" type="button" data-weather="rain" aria-pressed="false">Дощ</button>
          <button class="opt" type="button" data-weather="fog" aria-pressed="false">Туман</button>
          <button class="opt" type="button" data-weather="night" aria-pressed="false">Ніч</button>
        </div>
        <span class="lbl">МАШИНА</span>
        <div class="row" role="group" aria-label="Машина">
          <button class="opt" type="button" data-car="suv" aria-pressed="true">Кросовер</button>
          <button class="opt" type="button" data-car="ev" aria-pressed="false">Електрокар</button>
          <button class="opt" type="button" data-car="ferrari" aria-pressed="false">Суперкар</button>
        </div>
        <p class="info" id="info"></p>
        <p class="info gold" id="wallet"></p>
      </div>
      <div class="shop" id="shop" hidden>
        <div class="head">ГАМАНЕЦЬ · <span class="gold" id="shopMoney"></span></div>
        <div id="shopList" style="display:grid;gap:6px"></div>
        <div class="btns"><button class="btn alt" id="shopBack" type="button">Назад</button></div>
      </div>
      <div class="btns" id="mainBtns">
        <button class="btn" id="go" type="button">Поїхати</button>
        <button class="btn alt" id="shopBtn" type="button">Магазин</button>
        <button class="btn alt" id="menuBtn" type="button" hidden>Меню</button>
      </div>
    </div>
  </div>
  <div class="pads" id="pads">
    <div class="grp">
      <button class="pad" type="button" data-k="down">ГАЛЬМО</button>
      <button class="pad" type="button" data-k="up">ГАЗ</button>
    </div>
  </div>
  <div class="bar">
    <p class="hint"><b>W / ↑</b> газ · <b>S / ↓</b> гальмо · <b>кермо</b> тягніть мишею або пальцем (також A D / ← →) · <b>Enter</b> старт</p>
    <span><button class="mute" id="toMenu" type="button">Меню</button> <button class="mute" id="mute" type="button">Звук: ввімк</button></span>
  </div>
</main>

<script>
(() => {
'use strict';
const W = 320, H = 200;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

/* ---------- colour helpers (ABGR, little endian) ---------- */
const col = (h) => { const n = parseInt(h.slice(1), 16); return (0xFF000000 | ((n & 255) << 16) | (n & 0xFF00) | ((n >> 16) & 255)) >>> 0; };
const mix = (a, b, t) => {
  const ar = a & 255, ag = (a >> 8) & 255, ab = (a >> 16) & 255, br = b & 255, bg = (b >> 8) & 255, bb = (b >> 16) & 255;
  return (0xFF000000 | (((ab + (bb - ab) * t) | 0) << 16) | (((ag + (bg - ag) * t) | 0) << 8) | ((ar + (br - ar) * t) | 0)) >>> 0;
};
const shade = (c, d) => {
  let r = (c & 255) + d, g = ((c >> 8) & 255) + d, b = ((c >> 16) & 255) + d;
  r = r < 0 ? 0 : r > 255 ? 255 : r; g = g < 0 ? 0 : g > 255 ? 255 : g; b = b < 0 ? 0 : b > 255 ? 255 : b;

const hash = (n) => { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; };

/* ---------- palette (taken from the photo: overcast sky, green field, grey gravel, black cabin) ---------- */
let SKY0 = col('#8ea3cc'), SKY1 = col('#d5dae7'), HAZE = col('#d3d9e6'), CLOUD = col('#eef1f7'), CLOUDD = col('#9fadcb');
const WEATHERS = {
  clear:  { sky0: '#8ea3cc', sky1: '#d5dae7', haze: '#d3d9e6', cloud: '#eef1f7', cloudd: '#9fadcb', clouds: 1, fogK: 0.25, fogMax: 0.9, mul: 1, desat: 0, tint: [1, 1, 1], cab: 1 },
  cloudy: { sky0: '#9aa3ae', sky1: '#d2d6da', haze: '#cdd1d5', cloud: '#e4e7ea', cloudd: '#838c98', clouds: 0.6, fogK: 0.22, fogMax: 0.92, mul: 0.9, desat: 0.3, tint: [0.97, 0.99, 1.03], cab: 0.92 },
  rain:   { sky0: '#68717c', sky1: '#a4abb2', haze: '#9aa2a9', cloud: '#b6bcc2', cloudd: '#5d6670', clouds: 0.8, fogK: 0.35, fogMax: 0.94, mul: 0.8, desat: 0.35, tint: [0.95, 0.98, 1.05], rain: true, lights: true, cab: 0.8 },
  fog:    { sky0: '#c4c9cc', sky1: '#d9dcdc', haze: '#d4d7d7', cloud: '#d9dcdc', cloudd: '#c0c5c7', clouds: 0.2, fogK: 0.95, fogMax: 0.97, mul: 0.96, desat: 0.25, tint: [1, 1, 1], lights: true, cab: 0.9 },
  night:  { sky0: '#04081a', sky1: '#121c36', haze: '#0b1326', cloud: '#1a2440', cloudd: '#070c1c', clouds: 0.3, fogK: 0.3, fogMax: 0.9, mul: 0.2, desat: 0.15, tint: [0.8, 0.9, 1.2], night: true, lights: true, cab: 0.4 }
};
let WX = WEATHERS.clear, WKEY = 'clear', FOGK = 0.25, FOGMAX = 0.9;
function applyWeather(key) {
  WKEY = key; WX = WEATHERS[key]; SKY0 = col(WX.sky0); SKY1 = col(WX.sky1); HAZE = col(WX.haze); CLOUD = col(WX.cloud); CLOUDD = col(WX.cloudd); FOGK = WX.fogK; FOGMAX = WX.fogMax;
}
const dim = (c, m) => (0xFF000000 | ((((c >> 16) & 255) * m | 0) << 16) | ((((c >> 8) & 255) * m | 0) << 8) | ((c & 255) * m | 0)) >>> 0;
const HILL = col('#a9b9ae'), HILL2 = col('#7f9585');
const GRA = col('#79a840'), GRB = col('#8cae48');
const ASPH = col('#85868a'), SHLD = col('#919296'), LINE = col('#ecebe4'), RAIL = col('#aeb4b8'), RAILP = col('#6d7377'), RAILT = col('#d3d8da'), CONC = col('#b6b5ae'), CONCT = col('#d6d5cd');
const DASH = col('#151617'), DASH2 = col('#1d1e20'), CHROME = col('#9a9da3'), WHITE = col('#e8ebee');

/* ---------- drawing primitives ---------- */
function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = c; }
function rect(x, y, w, h, c) { x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h); const x1 = Math.min(W, x + w), y1 = Math.min(H, y + h); for (let j = Math.max(0, y); j < y1; j++) for (let i = Math.max(0, x); i < x1; i++) buf[j * W + i] = c; }
function disc(cx, cy, r, c) { const r2 = r * r; for (let j = Math.max(0, Math.floor(cy - r)); j <= Math.min(H - 1, Math.ceil(cy + r)); j++) for (let i = Math.max(0, Math.floor(cx - r)); i <= Math.min(W - 1, Math.ceil(cx + r)); i++) { const dx = i + .5 - cx, dy = j + .5 - cy; if (dx * dx + dy * dy <= r2) buf[j * W + i] = c; } }
function ring(cx, cy, r0, r1, c) { const a = r0 * r0, b = r1 * r1; for (let j = Math.max(0, Math.floor(cy - r1)); j <= Math.min(H - 1, Math.ceil(cy + r1)); j++) for (let i = Math.max(0, Math.floor(cx - r1)); i <= Math.min(W - 1, Math.ceil(cx + r1)); i++) { const dx = i + .5 - cx, dy = j + .5 - cy, d = dx * dx + dy * dy; if (d >= a && d <= b) buf[j * W + i] = c; } }
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  for (let n = 0; n < 400; n++) { if (x0 >= 0 && x0 < W && y0 >= 0 && y0 < H) buf[y0 * W + x0] = c; if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function orect(cx, cy, len, th, ang, c) {
  const ca = Math.cos(ang), sa = Math.sin(ang), R = Math.ceil(Math.hypot(len, th) / 2) + 1;
  for (let j = Math.floor(cy) - R; j <= cy + R; j++) for (let i = Math.floor(cx) - R; i <= cx + R; i++) {
    const dx = i + .5 - cx, dy = j + .5 - cy, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
    if (Math.abs(u) <= len / 2 && Math.abs(v) <= th / 2) px(i, j, c);
  }
}
function poly(pts, c) {
  let minY = Infinity, maxY = -Infinity; for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
  for (let y = Math.max(0, Math.ceil(minY)); y <= Math.min(H - 1, Math.floor(maxY)); y++) {
    const xs = [];
    for (let k = 0; k < pts.length; k++) { const a = pts[k], b = pts[(k + 1) % pts.length]; if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1])); }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) { const x0 = Math.max(0, Math.round(xs[k])), x1 = Math.min(W - 1, Math.round(xs[k + 1]) - 1); for (let x = x0; x <= x1; x++) buf[y * W + x] = c; }
  }
}

/* ---------- 3x5 pixel font ---------- */
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111',
  'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
  'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','K':'101101110101101',
  'L':'100100100100111','M':'101111111101101','N':'110101101101101','O':'010101101101010','P':'110101110100100',
  'R':'110101110101101','S':'011100010001110','T':'111010010010010','U':'101101101101111','V':'101101101101010',
  'W':'101101111111101','X':'101101010101101','Y':'101101010010010','Z':'111001010100111',
  '.':'000000000000010',':':'000010000010000','-':'000000111000000','/':'001001010100100','+':'000010111010000','!':'010010010000010'
};
function text(s, x, y, c, sc) { sc = sc || 1; for (const ch of s) { const g = FONT[ch]; if (g) for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (g[r * 3 + q] === '1') rect(x + q * sc, y + r * sc, sc, sc, c); x += 4 * sc; } }
const tw = (s, sc) => s.length * 4 * sc - sc;

/* ---------- track ---------- */
const SEC = 170;
function cvAt(i) { if (i <= 0) return 0; if (i === 1) return 0.0014; const r = hash(i * 7 + 3); if (r < 0.3) return 0; const s = hash(i * 13 + 5) < 0.5 ? -1 : 1; return s * (0.0018 + 0.0042 * hash(i * 29 + 11)); }
let STRAIGHT = true;   // the default road is dead straight, like the highway in the photo
function curve(z) { if (STRAIGHT) return 0; const i = Math.floor(z / SEC); let t = (z - i * SEC) / SEC; t = t * t * (3 - 2 * t); return cvAt(i) * (1 - t) + cvAt(i + 1) * t; }

/* ---------- sprites built in code ---------- */
const mk = (w, h) => ({ w, h, d: new Uint32Array(w * h) });
const bpx = (b, x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < b.w && y >= 0 && y < b.h) b.d[y * b.w + x] = c; };
function bline(b, x0, y0, x1, y1, c) { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (let n = 0; n < 200; n++) { bpx(b, x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } }
function brect(b, x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) bpx(b, i, j, c); }

function makeTree(seed) {
  const b = mk(30, 38), r = rng(seed), TR = col('#66574a'), TL = col('#8b7d68'), LF = col('#b9bd8a'), LF2 = col('#a0aa70');
  for (let y = 37; y >= 24; y--) { bpx(b, 14, y, TR); bpx(b, 15, y, TR); if (y > 33) { bpx(b, 13, y, TR); bpx(b, 16, y, TR); } }
  const leaf = (x, y) => { for (let k = 0; k < 4; k++) bpx(b, x + Math.round((r() - .5) * 3), y + Math.round((r() - .5) * 3), r() < .5 ? LF : LF2); };
  const branch = (x, y, a, len, depth) => {
    if (depth === 0 || len < 2) { leaf(x, y); return; }
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len; bline(b, x, y, x2, y2, depth > 3 ? TR : TL);
    branch(x2, y2, a + (r() - .5) * 1.3 - .35, len * .74, depth - 1); branch(x2, y2, a + (r() - .5) * 1.3 + .35, len * .74, depth - 1);
  };
  branch(14.5, 25, -Math.PI / 2 + (r() - .5) * .2, 8, 5); branch(14.5, 29, -Math.PI / 2 - .9, 7, 4); branch(15, 28, -Math.PI / 2 + .9, 7, 4);
  return b;
}

      else if (r < 0.36) list.push({ d, lat: s * (1.3 + hash(i * 9 + s) * 1.6), bm: BUSHES[(hash(i + 7) * 2) | 0], w: 2.6, h: 1.4 });
    }
  }
  { const ev = CFG.cab === 'ev';
    for (const st of S.stations) {
      const parts = [[-110, 1.45, ev ? SIGN_EV : SIGN_GAS, 1.6, 3.4], [6, 1.6, ev ? CHARGER : PUMP, 0.9, 1.9], [16, 1.6, ev ? CHARGER : PUMP, 0.9, 1.9], [26, 1.6, ev ? CHARGER : PUMP, 0.9, 1.9], [34, 3.6, SHOPB, 7, 3.2]];
      for (const q of parts) { const d = st.z + q[0] - S.pos; if (d > 5.5 && d < K) list.push({ d, lat: q[1], bm: q[2], w: q[3], h: q[4] }); }
    } }
  for (const c of S.cars) { const d = c.z - S.pos; if (d > 5.5 && d < K) list.push({ d, lat: c.u, bm: c.pol ? POLICE : CARS[c.k], w: 1.95, h: 1.55 }); }
  list.sort((a, b) => b.d - a.d);
  for (const o of list) drawSprite(o.bm, o.d, o.lat, o.w, o.h);
}

/* ---------- render: cabin (drawn from the photo) ---------- */
function gauge(cx, cy, r, val, ticks, major, redFrom) {
  disc(cx, cy, r + 1, col('#2b2c30')); disc(cx, cy, r, col('#0c0d10'));
  for (let k = 0; k <= ticks; k++) {
    const t = k / ticks, a = (135 + 270 * t) * Math.PI / 180, mj = k % major === 0, r0 = r - (mj ? 4 : 3), r1 = r - 1;
    line(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, (redFrom != null && t >= redFrom) ? col('#d8452f') : col('#c9ced2'));
  }
}
function needle(cx, cy, r, val) { const a = (135 + 270 * Math.max(0, Math.min(1, val))) * Math.PI / 180; line(cx, cy, cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2), col('#ee5a2b')); disc(cx, cy, 1.4, col('#2a2b2f')); }

function readMazda() {
  const kmh = S.v * 3.6;
  // live gauges drawn over the photo's gauges, same positions
  gauge(127, 122, 13, 0, 8, 1, 0.76); needle(127, 122, 13, S.rpm / 8000);
  gauge(193, 122, 13, 0, 4, 2, null); needle(193, 122, 13, S.type === 'free' ? 1 : S.time / 60);
  if (S.mode === 'play' && S.time < 10 && ((S.time * 3) | 0) % 2 === 0) disc(193, 130, 1.4, col('#f2a21c'));
  gauge(159, 117, 15, 0, 12, 2, null);
  text(String(Math.round(kmh)).padStart(3, ' '), 154, 120, col('#cfd3d6'), 1);
  needle(159, 117, 15, kmh / 240);
  // infotainment screen
  rect(223, 80, 77, 17, col('#0b1b1f'));
  text(String(Math.round(kmh)).padStart(3, ' '), 226, 81, col('#d6f2ee'), 2); text('KM/H', 226, 92, col('#6d8a8d'), 1);
  const tl = Math.ceil(S.time), low = S.mode === 'play' && S.time < 10 && ((S.time * 3) | 0) % 2 === 0;
  text('TIME', 253, 81, col('#6d8a8d'), 1); text(S.type === 'free' ? '--' : String(tl).padStart(2, ' '), 253, 87, low ? col('#f25a3a') : (S.type === 'free' ? col('#6d8a8d') : col('#f2b134')), 2);
  const km = S.dist / 1000; text('DIST', 277, 81, col('#6d8a8d'), 1); text(km < 10 ? km.toFixed(1) : String(Math.round(km)), 277, 87, col('#d6f2ee'), 2);
}


function readFerrari() {

  rect(121, 107, 87, 38, col('#24262b')); rect(122, 108, 85, 36, col('#06070a'));
  const sp = String(kmh); text(sp, Math.round(164 - tw(sp, 3) / 2), 112, col('#f5c400'), 3); text('KM/H', 152, 129, col('#8a8a80'), 1);
  text('TIME ' + (S.type === 'free' ? '--' : String(Math.ceil(S.time))), 126, 137, low ? col('#ff5a3c') : col('#e8e8e4'), 1);
  text('DIST ' + (km < 10 ? km.toFixed(1) : String(Math.round(km))), 166, 137, col('#e8e8e4'), 1);
}

// rain on the glass: drops only where the cabin photo has glass, blown up the screen as you speed up
const DROPS = Array.from({ length: 170 }, () => ({ x: Math.random() * W, y: Math.random() * 135, s: 0.4 + Math.random() * 1.2, big: Math.random() < 0.22 }));
let FDT = 0.016;
// colour grade for the scene: dimmer, greyer, tinted; at night only the road near the car is lit by the headlights
function applyGrade() {
  if (WX.mul === 1 && !WX.desat) return;
  const y1 = Math.min(H, curHor + ROWS + 1), ds = WX.desat, tr = WX.tint[0], tg = WX.tint[1], tb = WX.tint[2];
  for (let y = 0; y < y1; y++) {
    let m = WX.mul; if (WX.night && y > curHor) { const t = Math.min(1, (y - curHor) / (ROWS * 0.55)); m = WX.mul + (0.95 - WX.mul) * t * t; }
    const row = y * W, mr = m * tr, mg = m * tg, mb = m * tb;
    for (let x = 0; x < W; x++) {
      const c = buf[row + x]; let r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
      if (ds) { const gr = 0.3 * r + 0.59 * g + 0.11 * b; r += (gr - r) * ds; g += (gr - g) * ds; b += (gr - b) * ds; }
      r *= mr; g *= mg; b *= mb; r = r > 255 ? 255 : r; g = g > 255 ? 255 : g; b = b > 255 ? 255 : b;
      buf[row + x] = (0xFF000000 | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0)) >>> 0;
    }
  }
}
const STARS = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * 60, b: 110 + ((Math.random() * 145) | 0) }));
function drawStars() {
  if (!WX.night) return;
  for (const st of STARS) { const x = (((st.x - S.heading * 90) % W) + W) % W | 0, y = st.y | 0; if (y < curHor - 8) buf[y * W + x] = (0xFF000000 | (st.b << 16) | (st.b << 8) | st.b) >>> 0; }
}
function drawTailLights() {
  if (!WX.lights) return;
  for (const c of S.cars) {
    const d = c.z - S.pos, h = K / d; if (d < 5.5 || d > K * 0.9 || h < 1 || h > ROWS - 0.5) continue;
    const i0 = Math.floor(h), f = h - i0, cen = CEN[i0] * (1 - f) + CEN[i0 + 1] * f, hw = HW[i0] * (1 - f) + HW[i0 + 1] * f, ppm = hw / RW;
    const tw_ = Math.max(1, Math.round(1.95 * ppm)), th = Math.round(1.55 * ppm), left = Math.round(cen + c.u * hw - tw_ / 2), top = Math.round(curHor + h - th);
    const y = top + Math.round(th * 0.52), sz = Math.max(1, Math.round(tw_ * 0.1));
    rect(left + Math.round(tw_ * 0.12), y, sz + 1, sz, col('#ff3b2e')); rect(left + tw_ - 1 - Math.round(tw_ * 0.12) - sz, y, sz + 1, sz, col('#ff3b2e'));
  }
}

function renderRain() {
  const cb = CABIN; if (!WX.rain || !cb.bgData) return;
  for (const d of DROPS) {
    d.y -= d.s * (2 + S.v * 0.32) * FDT; d.x += d.s * (0.5 + S.v * 0.04) * FDT * (d.x < W / 2 ? -1 : 1);
    if (d.y < 0 || d.x < 0 || d.x >= W) { d.y = 125 + Math.random() * 10; d.x = Math.random() * W; }
    const x = d.x | 0, y = d.y | 0; if (y < 0 || y >= H - 2 || (cb.bgData[y * W + x] >>> 24) !== 0) continue;
    buf[y * W + x] = shade(buf[y * W + x], 46); buf[(y + 1) * W + x] = shade(buf[(y + 1) * W + x], -34);
    if (d.big && x + 1 < W) { buf[y * W + x + 1] = shade(buf[y * W + x + 1], 30); buf[(y + 1) * W + x + 1] = shade(buf[(y + 1) * W + x + 1], -24); }
  }
}

function readTesla() {
  const kmh = Math.round(S.v * 3.6), WHT = col('#f2f2f2'), DIM = col('#8a8f94');
  const sp = String(kmh); text(sp, Math.round(163 - tw(sp, 3) / 2), 76, WHT, 3); text('KM/H', 152, 93, DIM, 1);
  rect(231, 77, 44, 80, col('#030304'));
  const low = S.mode === 'play' && S.time < 10 && ((S.time * 3) | 0) % 2 === 0, km = S.dist / 1000;
  text('TIME', 235, 82, DIM, 1); text(S.type === 'free' ? '--' : String(Math.ceil(S.time)), 235, 88, low ? col('#ff5a3c') : WHT, 2);
  text('DIST', 235, 110, DIM, 1); text(km < 10 ? km.toFixed(1) : String(Math.round(km)), 235, 116, WHT, 2);
  text('D', 235, 140, col('#59d28c'), 2);
}

function drawCabin() {
  const cb = CABIN;
  if (cb.bgData) for (let i = 0; i < W * H; i++) { const c = cb.bgData[i]; if ((c >>> 24) === 255) buf[i] = WX.cab < 1 ? dim(c, WX.cab) : c; }
  cb.read(); drawWheel();
}

// the wheel from the photo, rotated around its hub by nearest-neighbour sampling
function drawLayer(data, WCX, WCY, WR, k, th, LW, LH) {
  LW = LW || W; LH = LH || H;
  const ca = Math.cos(th), sa = Math.sin(th);
  for (let y = Math.max(0, Math.floor(WCY - WR)); y < H; y++) {
    for (let x = Math.floor(WCX - WR); x <= WCX + WR; x++) {
      const dx = x + 0.5 - WCX, dyu = (y + 0.5 - WCY) * k;
      const sx = Math.floor(WCX + dx * ca + dyu * sa), sy = Math.floor(WCY + (-dx * sa + dyu * ca) / k);
      if (sx < 0 || sx >= LW || sy < 0 || sy >= LH) continue;
      const c = data[sy * LW + sx]; if ((c >>> 24) === 255) buf[y * W + x] = WX.cab < 1 ? dim(c, WX.cab) : c;
    }
  }
}
function drawWheel() {
  const cb = CABIN; if (!cb.whData) return;
  const th = S.steer * 1.1 + (S.off ? (hash(Math.floor(S.pos * 3)) - 0.5) * 0.06 : 0);
  if (cb.wh2Data) drawLayer(cb.wh2Data, cb.wc2[0], cb.wc2[1], cb.wr2, 1, th);   // the rim turns too
  drawLayer(cb.whData, cb.wc[0], cb.wc[1], cb.wr, cb.k, th, cb.whW, cb.whH);
  const m = cb.rim; if (m) px(m[0] + Math.sin(th) * m[2], m[1] - Math.cos(th) * m[2], col('#ff7a2b'));   // one marker pixel on the rim
}

// steer by dragging the wheel with mouse or finger
const drag = { on: false, a0: 0, s0: 0 };
const wheelAngle = (e) => { const r = cvs.getBoundingClientRect(); const d = CABIN.drag; return Math.atan2((e.clientY - r.top) / r.height * H - d[1], (e.clientX - r.left) / r.width * W - d[0]); };
cvs.style.touchAction = 'none';
cvs.addEventListener('pointerdown', (e) => {
  const r = cvs.getBoundingClientRect(), d = CABIN.drag, x = (e.clientX - r.left) / r.width * W - d[0], y = (e.clientY - r.top) / r.height * H - d[1];
  if (Math.hypot(x, y) > d[2] + 6) return;
  drag.on = true; drag.a0 = wheelAngle(e); drag.s0 = S.steer; cvs.setPointerCapture(e.pointerId); audioStart(); e.preventDefault();
});
cvs.addEventListener('pointermove', (e) => {
  if (!drag.on) return;
  let d = wheelAngle(e) - drag.a0; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
  S.steer = Math.max(-1, Math.min(1, drag.s0 + d / 1.1));
});
const dragEnd = () => { drag.on = false; };
cvs.addEventListener('pointerup', dragEnd); cvs.addEventListener('pointercancel', dragEnd);

function renderHUD() {
  if (S.msgT > 0 && S.msg) {
    const sc = 2, w = tw(S.msg, sc), x = Math.round((W - w) / 2), y = 14;
    text(S.msg, x + 1, y + 1, col('#1b1b1b'), sc); text(S.msg, x, y, S.msg[0] === 'C' && S.msg[1] === 'R' ? col('#ff6a4d') : col('#fff3c4'), sc);
  }
  if (S.crashT > 0) for (let y = 0; y < 100; y++) for (let x = (y & 1); x < W; x += 2) buf[y * W + x] = shade(buf[y * W + x], 70);
}

/* ---------- audio ---------- */
let AC = null, osc, gain, filt, muted = false;
function audioStart() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      osc = AC.createOscillator(); osc.type = 'sawtooth'; filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 500;
      gain = AC.createGain(); gain.gain.value = 0; osc.connect(filt); filt.connect(gain); gain.connect(AC.destination); osc.start();
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function audioUpdate() {
  if (!AC) return;
  const t = AC.currentTime, on = S.mode === 'play' && !muted;
  const ev = CFG.cab === 'ev', want = ev ? 'sine' : 'sawtooth'; if (osc.type !== want) osc.type = want;
  osc.frequency.setTargetAtTime(ev ? 90 + S.v * 9 : 28 + S.rpm / 42, t, 0.05); filt.frequency.setTargetAtTime(ev ? 1800 : 280 + S.rpm * 0.22, t, 0.08);
  gain.gain.setTargetAtTime(on ? (ev ? 0.03 : 0.05 + (keys.up ? 0.03 : 0)) : 0, t, 0.08);
}
function thud() {
  if (!AC || muted) return;
  try {
    const n = AC.sampleRate * 0.3, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0.5;
    s.buffer = b; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  } catch (e) { /* ignore */ }
}

/* ---------- input ---------- */
const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
addEventListener('keydown', (e) => {
  const k = map[e.key];
  if (k) { keys[k] = true; e.preventDefault(); audioStart(); return; }
  if (e.key === 'Enter' || (e.key === ' ' && S.mode !== 'play')) { if (S.mode !== 'play') { e.preventDefault(); startGame(); } }
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'Escape' && S.mode !== 'title') showMenu();
});
addEventListener('keyup', (e) => { const k = map[e.key]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.getElementById('go').addEventListener('click', startGame);
document.getElementById('menuBtn').addEventListener('click', showMenu);
function renderShop() {
  document.getElementById('shopMoney').textContent = '$' + Math.floor(SAVE.money);
  const box = document.getElementById('shopList'); box.textContent = '';
  for (const u of UPS) {
    const l = lv(u.k), max = l >= u.p.length, price = max ? 0 : u.p[l];
    const row = document.createElement('div'); row.className = 'it';
    const nm = document.createElement('div'); nm.textContent = u.name; const sm = document.createElement('small'); sm.textContent = u.d; nm.appendChild(sm);
    const pips = document.createElement('div'); pips.className = 'pips'; pips.textContent = '●'.repeat(l) + '○'.repeat(u.p.length - l);
    const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'opt'; bt.textContent = max ? 'МАКС' : 'Купити $' + price; bt.disabled = max || SAVE.money < price;
    bt.addEventListener('click', () => { if (SAVE.money >= price && !max) { SAVE.money -= price; SAVE.up[u.k] = l + 1; saveGame(); applyCar(); renderShop(); updateWallet(); } });
    row.append(nm, pips, bt); box.appendChild(row);
  }
}
document.getElementById('shopBtn').addEventListener('click', () => {
  document.getElementById('menu').hidden = true; document.getElementById('ovText').hidden = true; document.getElementById('mainBtns').hidden = true;
  document.getElementById('ovTitle').textContent = 'Магазин'; document.getElementById('shop').hidden = false; renderShop();
});
document.getElementById('shopBack').addEventListener('click', showMenu);
document.getElementById('toMenu').addEventListener('click', showMenu);
document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
  const k = b.dataset.mode ? 'mode' : b.dataset.road ? 'road' : b.dataset.weather ? 'weather' : 'car';
  document.querySelectorAll('.opt[data-' + k + ']').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  if (k === 'mode') S.type = b.dataset.mode; else if (k === 'road') STRAIGHT = b.dataset.road === 'straight'; else if (k === 'weather') applyWeather(b.dataset.weather); else { S.car = b.dataset.car; applyCar(); document.getElementById('info').textContent = CFG.info; }
  try { localStorage.setItem('pixel-drive-sel', S.type + ',' + S.car + ',' + (STRAIGHT ? 's' : 'c') + ',' + WKEY); } catch (e) { /* ignore */ }
}));
try { const sel = (localStorage.getItem('pixel-drive-sel') || '').split(','); if (sel[0] === 'free') document.querySelector('.opt[data-mode="free"]').click(); if (CARCFG[sel[1]]) document.querySelector('.opt[data-car="' + sel[1] + '"]').click(); if (sel[2] === 'c') document.querySelector('.opt[data-road="curvy"]').click(); if (WEATHERS[sel[3]]) document.querySelector('.opt[data-weather="' + sel[3] + '"]').click(); } catch (e) { /* ignore */ }
document.getElementById('info').textContent = CARCFG[S.car].info; updateWallet();
document.querySelectorAll('.pad').forEach((b) => {
  const k = b.dataset.k, on = (e) => { e.preventDefault(); keys[k] = true; b.classList.add('on'); audioStart(); }, off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});
function toggleMute() { muted = !muted; document.getElementById('mute').textContent = 'Звук: ' + (muted ? 'вимк' : 'ввімк'); }
document.getElementById('mute').addEventListener('click', toggleMute);

/* ---------- loop ---------- */
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  FDT = dt; update(dt); renderScene(); renderSprites(); applyGrade(); drawStars(); drawTailLights(); renderRain(); drawPoliceFx(); drawCracks(); drawCabin(); renderHUD(); drawPoliceHud(); drawEconHud();
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
